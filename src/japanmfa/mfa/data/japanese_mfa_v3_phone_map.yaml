model_family: japanese_mfa_v3
normalizations:
  ɴ: N
  ɡ: g
  ŋ: N
rules:
  - kana: [ア]
    phones: [a]
  - kana: [カ]
    phones: [k, a]
  - kana: [キョ]
    phones: [k, jo]
  - kana: [ン]
    phones: [N]
  - kana: [ッ]
    phones: [Q]
  - kana: [オ]
    phones: [o]
  - kana: [オ, ー]
    phones: [oː]
  - kana: [オ, ー]
    phones: [o]
  - kana: [オ, ー]
    phones: [o, o]
    mora_spans: [[0, 1], [1, 2]]
  - kana: [ハ]
    phones: [h, a]
  # Observed for 0922jap はぁ normalized to ハア: one long vowel spans both morae.
  - kana: [ハ, ア]
    phones: [h, aː]
    mora_spans: [[0, 1], [0, 2]]
  - kana: [レ]
    phones: [r, e]
  - kana: [ウ]
    phones: [u]
  - kana: [ス]
    phones: [s, ɯ]
  - kana: [ス]
    phones: [s, ɯ̥]
  # Observed in 0922jap 風邪 (カゼ), japanese_mfa G2P output: k a z e.
  - kana: [ゼ]
    phones: [z, e]
  # Observed in 0922jap ううん。おなか空いてない, japanese_mfa G2P.
  - kana: [ウ]
    phones: [ɯ]
  - kana: [ナ]
    phones: [n, a]
  - kana: [イ]
    phones: [i]
  - kana: [テ]
    phones: [t, e]
  # Observed MFA-selected variants in 0922jap 世界、大丈夫.
  - kana: [セ]
    phones: [s, e]
  - kana: [ダ]
    phones: [d, a]
  - kana: [ジョ]
    phones: [ʑ, o]
  # Observed on 0922jap 0060 after timestamp-guided MFA: ジョウ -> ʑ oː ɯ.
  - kana: [ジョ, ウ]
    phones: [ʑ, oː, ɯ]
    mora_spans: [[0, 1], [0, 2], [1, 2]]
  - kana: [ブ]
    phones: [b, ɯ]
  # Observed in 0922jap Qwen text 目の前がぐるぐるしてお。 and ご飯食べた。おかゆでも作ろうか。
  - kana: [メ]
    phones: [m, e]
  - kana: [ノ]
    phones: [n, o]
  - kana: [マ]
    phones: [m, a]
  - kana: [エ]
    phones: [e]
  - kana: [ガ]
    phones: [ɡ, a]
  - kana: [グ]
    phones: [ɡ, ɯ]
  - kana: [ル]
    phones: [ɾ, ɯ]
  - kana: [シ]
    phones: [ɕ, i]
  - kana: [ゴ]
    phones: [ɡ, o]
  - kana: [タ]
    phones: [t, a]
  - kana: [ベ]
    phones: [b, e]
  - kana: [ユ]
    phones: [j, ɨ]
  - kana: [デ]
    phones: [d, e]
  - kana: [モ]
    phones: [m, o]
  - kana: [ツ]
    phones: [ts, ɨ]
  - kana: [ク]
    phones: [k, ɯ]
  - kana: [ロ, ウ]
    phones: [ɾ, oː]
    mora_spans: [[0, 1], [0, 2]]
  # Exact Japanese MFA v3 variants observed in 0922jap 0090.
  - kana: [ソ]
    phones: [s, o]
  - kana: [ソ, ウ]
    phones: [s, oː]
    mora_spans: [[0, 1], [0, 2]]
  - kana: [ミ]
    phones: [mʲ, i]
  - kana: [ン]
    phones: [ɲ]
  - kana: [キ]
    phones: [c, i]
  - kana: [ワ]
    phones: [w, a]
  - kana: [ス]
    phones: [s, ɨ]
  - kana: [ネ]
    phones: [n, e]
  # Observed Japanese MFA v3 candidates for the AKABEiSOFT3 Galgame batch.
  - kana: [ッ]
    phones: [ʔ]
  - kana: [キョ]
    phones: [c, o]
  - kana: [リ]
    phones: [ɾʲ, i]
  - kana: [レ]
    phones: [ɾ, e]
  - kana: [ド]
    phones: [d, o]
  - kana: [コ]
    phones: [k, o]
  - kana: [チ]
    phones: [tɕ, i]
  - kana: [ラ]
    phones: [ɾ, a]
  - kana: [ロ]
    phones: [ɾ, o]
  - kana: [ト]
    phones: [t, o]
  - kana: [ケ]
    phones: [k, e]
  - kana: [ケ, イ]
    phones: [k, eː]
